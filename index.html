<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五木左京｜非公式ファンサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5f2;
      color: #222;
    }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 0.08em;
      margin: 0;
    }

    .subtitle {
      margin-top: 15px;
      color: #777;
      letter-spacing: 0.15em;
    }

    nav {
      margin-top: 50px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    nav a {
      text-decoration: none;
      color: #222;
      border: 1px solid #bbb;
      padding: 10px 18px;
      border-radius: 30px;
      background: white;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 90px 25px;
    }

    h2 {
      font-size: 28px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 12px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-top: 20px;
      border-radius: 15px;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>五木左京</h1>
    <div class="subtitle">ITSUKI SAKYO FAN ARCHIVE</div>

    <nav>
      <a href="#profile">PROFILE</a>
      <a href="#chronology">CHRONOLOGY</a>
      <a href="#works">WORKS</a>
      <a href="#words">WORDS</a>
    </nav>
  </header>

  <section id="profile">
    <h2>PROFILE</h2>
    <div class="card">
      <p>五木左京についてのプロフィールをまとめています。</p>
      <p>ここにプロフィール情報を追加していきます。</p>
    </div>
  </section>

  <section id="chronology">
    <h2>CHRONOLOGY</h2>
    <div class="card">
      <p>活動年表</p>
      <p>ここにデビューから現在までの出来事を追加していきます。</p>
    </div>
  </section>

  <section id="works">
    <h2>WORKS</h2>
    <div class="card">
      <p>配信・歌・イベントなどの活動記録。</p>
    </div>
  </section>

  <section id="words">
    <h2>WORDS</h2>
    <div class="card">
      <p>印象に残った発言などをまとめる予定です。</p>
    </div>
  </section>

  <footer>
    非公式ファンサイト / FAN-MADE
  </footer>

</body>
</html>
